<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Check JB | فحص الجيلبريك</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --primary: #ff2d95;
      --secondary: #00d4ff;
      --bg: #0a0a0f;
      --card-bg: rgba(18, 18, 30, 0.75);
      --glass: rgba(255, 255, 255, 0.03);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; transition: all 0.3s ease; }

    body {
      background: radial-gradient(ellipse at 20% 50%, #1a0a2e 0%, var(--bg) 50%, #0d1b2a 100%);
      color: #fff;
      font-family: 'Tajawal', sans-serif;
      padding: 20px;
      min-height: 100vh;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: 
        radial-gradient(circle at 10% 80%, rgba(255, 45, 149, 0.08) 0%, transparent 30%),
        radial-gradient(circle at 90% 20%, rgba(0, 212, 255, 0.08) 0%, transparent 30%);
      z-index: -1;
      animation: pulseBG 8s infinite alternate;
    }

    .container { max-width: 950px; margin: 0 auto; }

    .header-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(15, 15, 25, 0.5);
      backdrop-filter: blur(15px);
      border-radius: 50px;
      padding: 12px 30px;
      margin-bottom: 30px;
      border: 1px solid rgba(255, 255, 255, 0.06);
      box-shadow: 0 8px 32px rgba(255, 45, 149, 0.1);
    }

    .header-bar h1 {
      font-size: 1.8rem;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-weight: 800;
      margin: 0;
      flex-grow: 1;
      text-align: center;
      letter-spacing: -0.5px;
    }

    .lang-toggle {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #ddd;
      padding: 8px 20px;
      border-radius: 30px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.85rem;
      white-space: nowrap;
      backdrop-filter: blur(5px);
    }
    .lang-toggle:hover { background: rgba(255, 45, 149, 0.2); border-color: var(--primary); }

    header { text-align: center; margin-bottom: 30px; animation: slideDown 0.8s ease; }

    .logo {
      width: 85px; height: 85px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      border-radius: 50%;
      margin: 0 auto 15px;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 0 45px rgba(255, 45, 149, 0.4);
      animation: float 6s infinite ease-in-out;
    }
    .logo i { font-size: 2.3rem; color: #000; }

    .subtitle { color: #9b9bb0; font-size: 1rem; font-weight: 500; }

    .device-type-tabs {
      display: flex; justify-content: center; gap: 15px; margin: 35px 0 25px;
    }

    .device-tab {
      background: rgba(255,255,255,0.04);
      padding: 12px 35px;
      border-radius: 50px;
      cursor: pointer;
      border: 1px solid rgba(255,255,255,0.08);
      font-weight: 700;
      font-size: 1rem;
      backdrop-filter: blur(10px);
      color: #bbb;
    }

    .device-tab.active {
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: #000;
      box-shadow: 0 0 25px rgba(255, 45, 149, 0.5);
      border-color: transparent;
      font-weight: 800;
    }

    .card {
      background: var(--card-bg);
      border-radius: 30px;
      padding: 30px;
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.07);
      box-shadow: 0 20px 50px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,45,149,0.1);
      margin-bottom: 25px;
    }

    .selectors {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 25px;
      margin-bottom: 25px;
    }

    .input-group label {
      display: block;
      margin-bottom: 12px;
      color: var(--primary);
      font-weight: 700;
      font-size: 1.1rem;
      letter-spacing: 0.5px;
    }

    .search-box {
      width: 100%;
      padding: 14px 18px;
      background: rgba(0,0,0,0.4);
      border: 2px solid rgba(255,255,255,0.08);
      border-radius: 16px;
      color: #fff;
      font-size: 1rem;
      margin-bottom: 12px;
      outline: none;
    }
    .search-box:focus { border-color: var(--primary); box-shadow: 0 0 20px rgba(255,45,149,0.15); }

    select {
      width: 100%;
      padding: 14px 18px;
      background: rgba(0,0,0,0.4);
      border: 2px solid rgba(255,255,255,0.08);
      border-radius: 16px;
      color: #fff;
      font-size: 1rem;
      appearance: none;
      cursor: pointer;
      outline: none;
    }

    select:focus {
      border-color: var(--secondary);
      box-shadow: 0 0 20px rgba(0, 212, 255, 0.2);
    }

    .check-btn {
      width: 100%;
      padding: 20px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      border: none;
      border-radius: 20px;
      color: #000;
      font-size: 1.2rem;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 10px 35px rgba(255, 45, 149, 0.4);
      position: relative;
      overflow: hidden;
      margin: 25px 0 15px;
      letter-spacing: 0.5px;
    }

    .check-btn:hover { transform: translateY(-3px); box-shadow: 0 15px 40px rgba(255, 45, 149, 0.6); }
    .check-btn::after {
      content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
      transition: 0.6s;
    }
    .check-btn:hover::after { left: 100%; }

    .action-btns {
      display: none;
      gap: 12px;
      margin-top: 15px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .action-btn {
      padding: 10px 24px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 50px;
      color: #ddd;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 600;
      backdrop-filter: blur(10px);
    }
    .action-btn:hover { background: rgba(255, 45, 149, 0.2); border-color: var(--primary); }

    .result-box {
      margin-top: 25px;
      border-radius: 25px;
      padding: 0;
      max-height: 0;
      overflow: hidden;
      opacity: 0;
      transition: all 0.7s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .result-box.show { max-height: 1200px; opacity: 1; padding: 30px; margin-top: 25px; }

    .result-header {
      text-align: center;
      padding-bottom: 25px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      margin-bottom: 25px;
    }

    .status-icon { font-size: 4.5rem; margin-bottom: 15px; display: block; }

    .supported {
      background: rgba(0, 230, 118, 0.08);
      border: 2px solid rgba(0, 230, 118, 0.4);
      color: #69f0ae;
    }
    .unsupported {
      background: rgba(255, 82, 82, 0.08);
      border: 2px solid rgba(255, 82, 82, 0.4);
      color: #ff8a80;
    }

    .tools-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
      gap: 18px;
    }

    .tool-card {
      background: rgba(255,255,255,0.04);
      padding: 20px;
      border-radius: 20px;
      text-align: center;
      border: 1px solid rgba(255,255,255,0.06);
      backdrop-filter: blur(10px);
    }

    .tool-card:hover { transform: translateY(-8px); background: rgba(255,45,149,0.08); border-color: var(--primary); }

    .tool-name { font-size: 1.2rem; color: var(--secondary); font-weight: 800; margin-bottom: 8px; }
    .tool-desc { font-size: 0.85rem; color: #b0b0c0; margin-bottom: 15px; line-height: 1.4; }

    .tool-btn {
      display: inline-block;
      padding: 8px 22px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: #fff;
      text-decoration: none;
      border-radius: 50px;
      font-size: 0.8rem;
      font-weight: bold;
      box-shadow: 0 5px 15px rgba(255,45,149,0.3);
    }

    footer { margin-top: 40px; text-align: center; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 25px; }

    .socials { display: flex; justify-content: center; gap: 18px; margin: 20px 0; }
    .social-btn {
      width: 48px; height: 48px;
      border-radius: 50%;
      background: rgba(255,255,255,0.05);
      display: flex; align-items: center; justify-content: center;
      color: #fff; text-decoration: none; font-size: 1.2rem;
      border: 1px solid rgba(255,255,255,0.08);
      transition: 0.3s;
    }
    .social-btn:hover { background: var(--primary); color: #000; transform: scale(1.15); border-color: transparent; }

    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
    @keyframes slideDown { from { transform: translateY(-30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    @keyframes pulseBG { 0% { opacity: 0.5; } 100% { opacity: 0.9; } }

    @media (max-width: 600px) {
      .header-bar { flex-direction: column; gap: 10px; padding: 15px; }
      .header-bar h1 { font-size: 1.6rem; }
      .selectors { grid-template-columns: 1fr; }
      .device-tab { padding: 10px 25px; }
    }

    @media (max-width: 400px) {
      .logo { width: 65px; height: 65px; }
      .logo i { font-size: 1.8rem; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header-bar">
      <h1 id="mainTitle">Check JB Pro</h1>
      <button class="lang-toggle" id="langToggle" onclick="toggleLanguage()">🌐 English</button>
    </div>

    <header>
      <div class="logo"><i class="fas fa-unlock-alt"></i></div>
      <p class="subtitle" id="subtitle">أداة الفحص الشاملة لإمكانية الجيلبريك</p>

      <div class="device-type-tabs">
        <div class="device-tab active" id="tabiPhone" onclick="switchType('iphone')">iPhone</div>
        <div class="device-tab" id="tabiPad" onclick="switchType('ipad')">iPad</div>
      </div>
    </header>

    <div class="card">
      <div class="selectors">
        <div class="input-group">
          <label id="deviceLabel"><i class="fas fa-mobile-alt"></i> اختر الجهاز</label>
          <input type="text" class="search-box" id="deviceSearch" oninput="filterDevices()" placeholder="🔍 بحث عن جهاز...">
          <select id="deviceSelect" onchange="resetResult()" size="5" style="height: auto; overflow-y: auto;"></select>
        </div>

        <div class="input-group">
          <label id="iosLabel"><i class="fab fa-apple"></i> إصدار النظام (iOS)</label>
          <select id="iosSelect" onchange="resetResult()"></select>
        </div>
      </div>

      <button class="check-btn" onclick="checkJailbreak()">
        <i class="fas fa-search"></i> <span id="checkBtnText">افحص الآن</span>
      </button>

      <div id="actionBtns" class="action-btns">
        <button class="action-btn" onclick="copyReport()"><i class="fas fa-copy"></i> <span id="copyBtnText">نسخ التقرير</span></button>
        <button class="action-btn" onclick="shareReport()"><i class="fas fa-share-alt"></i> <span id="shareBtnText">مشاركة</span></button>
      </div>

      <div id="resultBox" class="result-box"></div>
    </div>

    <div class="card">
      <h3 style="color: var(--primary); margin-bottom: 15px;"><i class="fas fa-exclamation-circle"></i> <span id="disclaimerTitle">تنويه هام</span></h3>
      <p style="font-size: 0.95rem; color: #ccc; line-height: 1.7;" id="disclaimerText">
        • النتائج تعتمد على قاعدة بيانات محدثة، لكن قد تتغير الظروف. <br>
        • الجيلبريك عملية قد تلغي ضمان جهازك. <br>
        • تأكد دائماً من أخذ نسخة احتياطية قبل البدء.
      </p>
    </div>

    <footer>
      <div class="socials">
        <a href="https://t.me/+SrNJO0OctAIYDseZ" target="_blank" class="social-btn" style="background: #0088cc;"><i class="fab fa-telegram-plane"></i></a>
        <a href="https://www.snapchat.com/add/sww_p" target="_blank" class="social-btn" style="background: #fffc00; color: black;"><i class="fab fa-snapchat-ghost"></i></a>
        <a href="https://www.instagram.com/sww_p/" target="_blank" class="social-btn" style="background: #e1306c;"><i class="fab fa-instagram"></i></a>
      </div>
      <p style="color: #777; font-size: 0.9rem;"><span id="footerText">تم التطوير بواسطة</span> <span style="color: var(--primary);">Hz Bahkali</span> (أبو عساف) © 2025</p>
    </footer>
  </div>

  <script>
    // قاعدة البيانات
    const devicesDB = {
      iphone: [
        "iPhone 15 Pro Max", "iPhone 15 Pro", "iPhone 15 Plus", "iPhone 15",
        "iPhone 14 Pro Max", "iPhone 14 Pro", "iPhone 14 Plus", "iPhone 14",
        "iPhone 13 Pro Max", "iPhone 13 Pro", "iPhone 13", "iPhone 13 mini",
        "iPhone 12 Pro Max", "iPhone 12 Pro", "iPhone 12", "iPhone 12 mini",
        "iPhone 11 Pro Max", "iPhone 11 Pro", "iPhone 11",
        "iPhone XS Max", "iPhone XS", "iPhone XR",
        "iPhone X", "iPhone 8 Plus", "iPhone 8", "iPhone 7 Plus", "iPhone 7",
        "iPhone 6s Plus", "iPhone 6s", "iPhone 6 Plus", "iPhone 6", "iPhone SE"
      ],
      ipad: [
        "iPad Pro (M2)", "iPad Pro (M1)", "iPad Air 5", "iPad mini 6",
        "iPad (10th gen)", "iPad Pro (2020)", "iPad Air 4",
        "iPad (9th gen)", "iPad (8th gen)", "iPad (7th gen)", "iPad (6th gen)"
      ]
    };

    const iosVersions = [];
    for(let i=18; i>=12; i--) {
        iosVersions.push(`${i}.0`, `${i}.1`, `${i}.2`, `${i}.3`, `${i}.4`, `${i}.5`, `${i}.6`, `${i}.7`);
    }

    // الترجمات
    const translations = {
      ar: {
        mainTitle: "Check JB Pro",
        subtitle: "أداة الفحص الشاملة لإمكانية الجيلبريك",
        deviceLabel: "اختر الجهاز",
        iosLabel: "إصدار النظام (iOS)",
        searchPlaceholder: "🔍 بحث عن جهاز...",
        checkBtn: "افحص الآن",
        copyBtn: "نسخ التقرير",
        shareBtn: "مشاركة",
        disclaimerTitle: "تنويه هام",
        disclaimerText: "• النتائج تعتمد على قاعدة بيانات محدثة، لكن قد تتغير الظروف. <br>• الجيلبريك عملية قد تلغي ضمان جهازك. <br>• تأكد دائماً من أخذ نسخة احتياطية قبل البدء.",
        footer: "تم التطوير بواسطة",
        deviceTab1: "iPhone",
        deviceTab2: "iPad",
        supportedTitle: "مبروك! جهازك يدعم الجيلبريك",
        unsupportedTitle: "للأسف، الجيلبريك غير متاح",
        unsupportedMsg: "إصدار جهازك حديث جداً ولا توجد ثغرات متاحة حالياً.",
        tip: "نصيحة: لا تقم بالتحديث وأغلق التحديثات التلقائية.",
        availableTools: "الأدوات المتاحة:",
        downloadTool: "تنزيل الأداة",
        semiJBNote: "ملاحظة: هذا ليس جيلبريك كامل، لكن يسمح بتثبيت التويكات.",
        noJailbreakMsg: "للأسف، لا يوجد جيلبريك لهذا الإصدار على الأجهزة الحديثة حالياً.",
        palera1nDesc: "جيلبريك شبه مقيد لأجهزة Checkm8",
        unc0verDesc: "الأكثر شهرة واستقراراً",
        checkra1nDesc: "يتطلب كمبيوتر",
        dopamineDesc: "جيلبريك كامل (Rootless)",
        dopamine2Desc: "الجيلبريك الأقوى حالياً",
        serotoninDesc: "شبه جيلبريك (Semi-Jailbreak)"
      },
      en: {
        mainTitle: "Check JB Pro",
        subtitle: "Comprehensive Jailbreak Checker",
        deviceLabel: "Select Device",
        iosLabel: "iOS Version",
        searchPlaceholder: "🔍 Search device...",
        checkBtn: "Check Now",
        copyBtn: "Copy Report",
        shareBtn: "Share",
        disclaimerTitle: "Important Notice",
        disclaimerText: "• Results are based on updated database, but situations may change. <br>• Jailbreaking may void your warranty. <br>• Always backup before proceeding.",
        footer: "Developed by",
        deviceTab1: "iPhone",
        deviceTab2: "iPad",
        supportedTitle: "Congrats! Your device supports Jailbreak",
        unsupportedTitle: "Sorry, Jailbreak is not available",
        unsupportedMsg: "Your iOS version is too recent and no exploits are available yet.",
        tip: "Tip: Do not update and disable automatic updates.",
        availableTools: "Available Tools:",
        downloadTool: "Download Tool",
        semiJBNote: "Note: This is not a full jailbreak, but allows tweak injection.",
        noJailbreakMsg: "Unfortunately, no jailbreak exists for this version on modern devices.",
        palera1nDesc: "Semi-tethered jailbreak for Checkm8 devices",
        unc0verDesc: "Most famous and stable",
        checkra1nDesc: "Requires a computer",
        dopamineDesc: "Full Jailbreak (Rootless)",
        dopamine2Desc: "Currently the strongest jailbreak",
        serotoninDesc: "Semi-Jailbreak"
      }
    };

    let currentLang = 'ar';
    let currentType = 'iphone';
    let lastReportText = '';

    function toggleLanguage() {
      currentLang = currentLang === 'ar' ? 'en' : 'ar';
      document.documentElement.lang = currentLang;
      document.documentElement.dir = currentLang === 'ar' ? 'rtl' : 'ltr';
      const t = translations[currentLang];
      document.getElementById('mainTitle').innerText = t.mainTitle;
      document.getElementById('subtitle').innerText = t.subtitle;
      document.getElementById('deviceLabel').innerHTML = `<i class="fas fa-mobile-alt"></i> ${t.deviceLabel}`;
      document.getElementById('iosLabel').innerHTML = `<i class="fab fa-apple"></i> ${t.iosLabel}`;
      document.getElementById('deviceSearch').placeholder = t.searchPlaceholder;
      document.getElementById('checkBtnText').innerText = t.checkBtn;
      document.getElementById('copyBtnText').innerText = t.copyBtn;
      document.getElementById('shareBtnText').innerText = t.shareBtn;
      document.getElementById('disclaimerTitle').innerText = t.disclaimerTitle;
      document.getElementById('disclaimerText').innerHTML = t.disclaimerText;
      document.getElementById('footerText').innerText = t.footer;
      document.getElementById('tabiPhone').innerText = t.deviceTab1;
      document.getElementById('tabiPad').innerText = t.deviceTab2;
      document.getElementById('langToggle').innerHTML = currentLang === 'ar' ? '🌐 English' : '🌐 العربية';
      fillDeviceSelect();
      fillIOSSelect();
    }

    function fillDeviceSelect(filter = '') {
      const select = document.getElementById('deviceSelect');
      select.innerHTML = '';
      devicesDB[currentType].forEach(dev => {
        if (filter === '' || dev.toLowerCase().includes(filter.toLowerCase())) {
          const opt = document.createElement('option');
          opt.value = dev;
          opt.innerText = dev;
          select.appendChild(opt);
        }
      });
    }

    function fillIOSSelect() {
      const select = document.getElementById('iosSelect');
      select.innerHTML = '';
      iosVersions.forEach(v => {
        const opt = document.createElement('option');
        opt.value = parseFloat(v);
        opt.innerText = `iOS ${v}`;
        select.appendChild(opt);
      });
    }

    function filterDevices() {
      const query = document.getElementById('deviceSearch').value;
      fillDeviceSelect(query);
      resetResult();
    }

    function switchType(type) {
      currentType = type;
      document.querySelectorAll('.device-tab').forEach(t => t.classList.remove('active'));
      document.getElementById(type === 'iphone' ? 'tabiPhone' : 'tabiPad').classList.add('active');
      document.getElementById('deviceSearch').value = '';
      fillDeviceSelect();
      resetResult();
    }

    function resetResult() {
      document.getElementById('resultBox').classList.remove('show');
      document.getElementById('actionBtns').style.display = 'none';
    }

    function checkJailbreak() {
      const device = document.getElementById('deviceSelect').value;
      const ver = parseFloat(document.getElementById('iosSelect').value);
      const resultBox = document.getElementById('resultBox');
      const t = translations[currentLang];
      if (!device || !ver) {
        alert(currentLang === 'ar' ? 'يرجى اختيار الجهاز وإصدار النظام' : 'Please select device and iOS version');
        return;
      }

      let isSupported = false;
      let tools = [];
      let message = "";
      const checkm8Devices = ["iPhone X", "iPhone 8 Plus", "iPhone 8", "iPhone 7 Plus", "iPhone 7", "iPhone 6s", "iPhone 6s Plus", "iPhone SE", "iPad (6th gen)", "iPad (7th gen)"];

      if (checkm8Devices.includes(device)) {
        if (ver >= 15.0 && ver <= 16.7) {
          isSupported = true;
          tools.push({ name: "Palera1n", desc: t.palera1nDesc, link: "https://palera.in" });
        } else if (ver >= 12.0 && ver < 15.0) {
          isSupported = true;
          tools.push({ name: "unc0ver", desc: t.unc0verDesc, link: "https://unc0ver.dev" });
          tools.push({ name: "Checkra1n", desc: t.checkra1nDesc, link: "https://checkra.in" });
        }
      } else {
        if (ver >= 15.0 && ver <= 15.41) {
          isSupported = true;
          tools.push({ name: "Dopamine", desc: t.dopamineDesc, link: "https://ellekit.space/dopamine/" });
        } else if (ver >= 15.5 && ver <= 16.5) {
          isSupported = true;
          tools.push({ name: "Dopamine 2.0", desc: t.dopamine2Desc, link: "https://ellekit.space/dopamine/" });
        } else if (ver >= 16.51 && ver <= 16.61) {
          isSupported = true;
          tools.push({ name: "Serotonin", desc: t.serotoninDesc, link: "https://github.com/mineek/Serotonin" });
          message = t.semiJBNote;
        } else if (ver >= 17.0) {
          isSupported = false;
          message = t.noJailbreakMsg;
        }
      }

      let html = '';
      if (isSupported) {
        resultBox.className = "result-box show supported";
        html += `<div class="result-header"><i class="fas fa-check-circle status-icon"></i><h2>${t.supportedTitle}</h2><p>${message}</p></div><h3 style="margin-bottom:15px; color:#fff;">${t.availableTools}</h3><div class="tools-grid">`;
        tools.forEach(tool => {
          html += `<div class="tool-card"><div class="tool-name">${tool.name}</div><div class="tool-desc">${tool.desc}</div><a href="${tool.link}" target="_blank" class="tool-btn">${t.downloadTool}</a></div>`;
        });
        html += `</div>`;
      } else {
        resultBox.className = "result-box show unsupported";
        html += `<div class="result-header" style="border:none; margin:0;"><i class="fas fa-times-circle status-icon"></i><h2>${t.unsupportedTitle}</h2><p style="color:#ffcccc;">${message || t.unsupportedMsg}</p><p style="margin-top:10px; font-size:0.9rem;">${t.tip}</p></div>`;
      }

      resultBox.innerHTML = html;
      document.getElementById('actionBtns').style.display = 'flex';
      lastReportText = `${t.mainTitle}\n${device} / iOS ${ver}\n${isSupported ? '✅ ' + t.supportedTitle : '❌ ' + t.unsupportedTitle}\n${message ? message + '\n' : ''}${tools.length ? `Tools: ${tools.map(tl => tl.name).join(', ')}` : ''}`;
    }

    function copyReport() {
      if (lastReportText) {
        navigator.clipboard.writeText(lastReportText).then(() => alert(currentLang === 'ar' ? 'تم نسخ التقرير' : 'Report copied'));
      }
    }

    function shareReport() {
      if (navigator.share && lastReportText) {
        navigator.share({ title: 'Check JB Report', text: lastReportText }).catch(() => {});
      } else {
        copyReport();
      }
    }

    function init() {
      fillDeviceSelect();
      fillIOSSelect();
    }
    init();
  </script>
</body>
</html>
